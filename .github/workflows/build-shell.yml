name: Build shell (no game files)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "ndk;28.1.13356709" "platforms;android-34" "build-tools;34.0.0"
      - name: Build and verify shell
        shell: pwsh
        run: |
          python scripts/build_apk.py --ndk "$env:ANDROID_HOME/ndk/28.1.13356709" --jdk "$env:JAVA_HOME" --build-tools "$env:ANDROID_HOME/build-tools/34.0.0" --android-jar "$env:ANDROID_HOME/platforms/android-34/android.jar" --work "${{ runner.temp }}/taikou5-build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_release.py --apk "${{ runner.temp }}/taikou5-build/apk/Taikou.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Taikou5-mobile-shell-ci
          path: ${{ runner.temp }}/taikou5-build/apk/Taikou.apk
          if-no-files-found: error
          retention-days: 14
